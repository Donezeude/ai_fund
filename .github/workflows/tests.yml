name: tests

on: [push]

jobs:
    test:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-python@v5
              with:
                python-version: "3.12"
            - name: Install uv
              uses: astral-sh/setup-uv@v10.0.1
            - name: Sync
              run: uv sync
            - name: Run pytest
              run: uv run pytest